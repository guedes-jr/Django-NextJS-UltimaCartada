  </g>
  <rect x="82" y="422" width="512" height="260" rx="14" fill="#ffffff" stroke="#dfe4dc"/>
  <text x="112" y="466" fill="#1b1813" font-family="Arial" font-size="24" font-weight="800">Jogadas recentes</text>
  <g fill="#70675b" font-family="Arial" font-size="16">
