    <text x="24" y="88" fill="#1b1813" font-family="Arial" font-size="42" font-weight="800">4</text>
  </g>
  <g transform="translate(352 252)">
    <rect width="240" height="118" rx="12" fill="#f3e9d5" stroke="#e4d8c4"/>
