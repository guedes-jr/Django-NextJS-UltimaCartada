<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard administrativo do Cartada Viva</title>
  <desc id="desc">Mockup do painel administrativo com jogos, jogadas, pontos e evidencias pendentes.</desc>
  <rect width="1280" height="820" fill="#eef2ed"/>
  <rect x="42" y="40" width="1196" height="740" rx="26" fill="#ffffff" stroke="#e4d8c4"/>
  <rect x="42" y="40" width="1196" height="76" rx="26" fill="#1b1813"/>
  <text x="82" y="88" fill="#fff7e8" font-family="Arial" font-size="24" font-weight="800">Cartada Viva Admin</text>
  <text x="322" y="88" fill="#e9dfce" font-family="Arial" font-size="15" font-weight="700">Jogadores</text>
  <text x="432" y="88" fill="#e9dfce" font-family="Arial" font-size="15" font-weight="700">Grupos</text>
  <text x="526" y="88" fill="#e9dfce" font-family="Arial" font-size="15" font-weight="700">Rodadas</text>
  <text x="632" y="88" fill="#e9dfce" font-family="Arial" font-size="15" font-weight="700">Evidencias</text>
  <text x="82" y="176" fill="#1b1813" font-family="Arial" font-size="34" font-weight="800">Dashboard</text>
  <text x="82" y="208" fill="#70675b" font-family="Arial" font-size="18">Acompanhe jogos, ranking, evidencias e proximas acoes.</text>
  <g transform="translate(82 252)">
    <rect width="240" height="118" rx="12" fill="#f3e9d5" stroke="#ead8b5"/>
